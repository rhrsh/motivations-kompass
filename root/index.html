<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motivation Tracker</title>
  <!-- Frühere Adresse: leitet auf die App unter app/ weiter. Der Teil nach # (z. B. Einrichtungslink) bleibt erhalten. -->
  <script>location.replace("app/" + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=app/">
  <style>
    :root { --bg: #F1F3F6; --ink: #1B2230; --accent: #0E7C7B; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11161D; --ink: #E9EDF2; --accent: #4FC3B8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
    a { color: var(--accent); }
  </style>
</head>
<body><p>Weiter zur <a href="app/">App</a> …</p></body>
</html>
