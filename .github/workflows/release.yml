# GitHub Release: legt nach jedem Release automatisch Tag und Release an.
#
# Läuft erst, wenn die Auslieferung (deploy.yml) erfolgreich war. Die Auslieferung wartet ihrerseits auf grüne Tests.
# So gibt es nie ein GitHub Release für eine Version, die nicht live ist.
#
# Version  aus sw.js von main (VERSION = "vNN")
# Titel    aus dem Titel des Pull Requests, der diesen Stand nach main gebracht hat („Release vNN – …“)
# Text     aus dessen Beschreibung (Release Notes)
#
# Gibt es den Tag schon, passiert nichts. Das ist der Normalfall, wenn die Auslieferung wegen einer
# Änderung auf staging lief: main ist dann unverändert und schon released.
name: GitHub Release

on:
  workflow_run:
    workflows: [Auslieferung]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Release anlegen, falls die Version neu ist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD) # der ausgelieferte Stand von main
          VERSION=$(grep -o 'VERSION = "v[0-9]*"' sw.js | grep -o 'v[0-9]*')
          if [ -z "$VERSION" ]; then echo "Keine VERSION in sw.js gefunden"; exit 1; fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $VERSION gibt es schon, nichts zu tun." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Der Pull Request, der diesen Stand nach main gebracht hat
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0] // empty' > pr.json || true
          if [ -s pr.json ]; then
            TITLE=$(jq -r '.title' pr.json)
            jq -r '.body // ""' pr.json > notes.md
            printf '\n\nPull Request: #%s\n' "$(jq -r '.number' pr.json)" >> notes.md
          else
            TITLE="Release $VERSION"
            echo "Release $VERSION" > notes.md
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TITLE" --notes-file notes.md
          echo "Release $VERSION angelegt: $TITLE" >> "$GITHUB_STEP_SUMMARY"
