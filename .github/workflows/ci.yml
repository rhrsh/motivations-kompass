# CI (Continuous Integration): automatische Tests.
# Laufen bei jedem Pull Request und bei jeder Änderung auf staging und main.
# Rot heißt: nicht mergen. Nur nach grünen Tests wird ausgeliefert (siehe deploy.yml).
# Lokal: `npm test`.
name: Tests

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
