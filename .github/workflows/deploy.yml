# CD (Continuous Deployment): liefert die App auf GitHub Pages aus.
#
#   Production  /motivations-kompass/app/    Branch main     (echte Daten)
#   Beta        /motivations-kompass/beta/   Branch staging  (integrierter Stand aller fertigen Tickets, Testdaten)
#   Weiterleitung /motivations-kompass/      aus root/ von main (frühere Adresse → app/)
#
# Production und Beta liegen nebeneinander, nicht ineinander, damit sich beide als eigene Apps
# installieren lassen (specs/001-umgebungen.md, AK-10).
#
# Ausgeliefert wird erst, wenn die Tests ("Tests", ci.yml) auf main oder staging grün durchgelaufen sind.
# GitHub Pages kennt nur eine Website pro Repository, daher werden beide Umgebungen bei jedem Lauf
# zusammen neu ausgeliefert, jeweils mit dem aktuellen Stand ihres Branches.
# "workflow_run" läuft mit der Pipeline-Version von main. Änderungen an dieser Datei wirken erst nach dem Release.
name: Auslieferung

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Production (main) holen
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod
          persist-credentials: false

      - name: Gibt es den Branch staging?
        id: staging
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY" staging > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Beta (staging) holen
        if: steps.staging.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: staging
          path: beta
          persist-credentials: false

      - name: Website zusammenstellen
        run: |
          # Nur die Dateien der App, keine Tests, Specs oder Werkzeuge
          APP="index.html manifest.webmanifest sw.js css js icons"
          mkdir -p site/app
          cp prod/root/index.html prod/root/sw.js site/
          (cd prod && cp -r $APP ../site/app/)
          version() { grep -o 'VERSION = "v[0-9]*"' "$1/sw.js" | grep -o 'v[0-9]*'; }
          echo "Production: $(version prod) ($(git -C prod rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          if [ -d beta ]; then
            mkdir site/beta
            (cd beta && cp -r $APP ../site/beta/)
            # Installiert soll die Beta anders heißen und aussehen als die echte App
            sed -i 's/"name": "[^"]*"/"name": "Motivation Tracker Beta"/; s/"short_name": "[^"]*"/"short_name": "Motivation Beta"/' site/beta/manifest.webmanifest
            if [ -d site/beta/icons/beta ]; then cp site/beta/icons/beta/*.png site/beta/icons/; fi
            echo "Beta: $(version beta) ($(git -C beta rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Beta: kein Branch staging" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
