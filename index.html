<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Motivation Tracker</title>
  <meta name="description" content="Wöchentlicher Check: Wie gut sind meine Motivatoren erfüllt?">
  <meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11161D" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<div class="beta-badge" aria-hidden="true">Beta</div>
<div class="app">

  <!-- Start: Status der Woche und ein Knopf -->
  <section class="screen center" id="home">
    <span class="eyebrow accent" id="homeWeek">KW</span>
    <h1>Motivation Tracker</h1>
    <div class="spacer"></div>
    <div class="gauge big" id="homeGauge"><div class="gauge-face" id="homeFace"></div></div>
    <p class="status-text" id="homeText"></p>
    <div class="spacer"></div>
    <button class="btn" id="homeBtn" type="button">Woche bewerten</button>
    <button class="btn ghost" id="historyBtn" type="button">Verlauf</button>
    <div class="foot">
      <span class="foot-links">
        <button class="link small" id="exportBtn" type="button">Daten sichern</button>
        <button class="link small" id="importBtn" type="button">Sicherung laden</button>
      </span>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <span id="version"></span>
    </div>
    <!-- Nur in der Preview (beta) sichtbar -->
    <div class="foot beta-tools" id="betaTools" hidden>
      <button class="link small" id="sampleBtn" type="button">Beispieldaten laden</button>
      <button class="link small" id="resetBtn" type="button">Daten zurücksetzen</button>
    </div>
  </section>

  <!-- Bewerten: ein Motivator pro Schritt -->
  <section class="screen" id="step" hidden>
    <div class="top"><span class="saved" id="saveState" aria-live="polite"></span></div>
    <div class="stage center" id="stage">
      <div class="q" id="qBox">
        <div class="qicon" id="qIcon"></div>
        <h2 id="qName"></h2>
        <p id="qText"></p>
      </div>
      <div class="scale" id="scale" role="radiogroup" aria-label="Wie erfüllt?"></div>
      <div class="cbox">
        <textarea id="comment" rows="2" enterkeyhint="next" placeholder="Warum? (optional)"></textarea>
        <button class="btn next" id="commentNext" type="button" hidden>Weiter →</button>
      </div>
    </div>
    <div class="bottombar">
      <button class="round" id="backBtn" type="button" aria-label="Zurück"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="count" id="stepCount">1 / 7</span>
      <div class="progress" id="progress" aria-label="Motivatoren"></div>
    </div>
  </section>

  <!-- Auswertung: passt ohne Scrollen auf einen Bildschirm -->
  <section class="screen" id="summary" hidden>
    <div class="overall">
      <div class="gauge" id="avgGauge"><div class="gauge-face" id="avgFace"></div></div>
      <div>
        <span class="eyebrow accent" id="sumWeek">KW</span>
        <span class="muted">Im Schnitt</span><b id="avg">–</b>
      </div>
    </div>
    <div class="card"><div class="items" id="items"></div></div>
    <p class="note">Zum Ändern einen Motivator antippen. <button class="link small" id="sumHistoryBtn" type="button">Verlauf ansehen</button></p>
    <div class="spacer"></div>
    <div class="actions">
      <button class="btn ghost" id="redoBtn" type="button">Neu ausfüllen</button>
      <button class="btn" id="doneBtn" type="button">Fertig</button>
    </div>
  </section>

  <!-- Verlauf: Entwicklung je Motivator über die Wochen -->
  <section class="screen" id="history" hidden>
    <div class="toprow">
      <button class="round" id="historyBack" type="button" aria-label="Zurück"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div><span class="eyebrow accent">Verlauf</span><h1>Entwicklung</h1></div>
    </div>
    <!-- Eigene Entscheidungsfrage (Spec 003) -->
    <button class="h-question" id="questionBtn" type="button"></button>
    <div class="card q-edit" id="questionEdit" hidden>
      <label class="eyebrow" for="questionInput">Meine Frage</label>
      <textarea id="questionInput" rows="3" maxlength="140" enterkeyhint="done" placeholder="z. B. Will ich so weitermachen?"></textarea>
      <div class="q-edit-foot">
        <span class="q-count" id="questionCount" aria-live="polite"></span>
        <button class="btn ghost small" id="questionCancel" type="button">Abbrechen</button>
        <button class="btn small" id="questionSave" type="button">Speichern</button>
      </div>
    </div>
    <div class="card h-card">
      <div class="h-nav">
        <button class="pager h-older" type="button" aria-label="Ältere Wochen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="h-range"></span>
        <button class="pager h-newer" type="button" aria-label="Neuere Wochen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="h-head"><span></span><div class="kw" aria-hidden="true"></div></div>
      <div class="h-rows"></div>
    </div>
    <p class="note">Richtung: letzte 4 bewertete Wochen gegenüber den 4 davor. Zeile antippen für Details.</p>
  </section>

  <!-- Detail: ein Motivator über alle Wochen, mit Kommentaren -->
  <section class="screen" id="detail" hidden>
    <div class="toprow">
      <button class="round" id="detailBack" type="button" aria-label="Zurück"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="eyebrow accent">Verlauf</span>
    </div>
    <div class="d-top center">
      <div class="qicon d-icon"></div>
      <h2 class="d-name"></h2>
      <p class="d-q"></p>
    </div>
    <div class="chart d-chart"></div>
    <p class="d-cmp"></p>
    <div class="d-comments"></div>
  </section>

</div>
</body>
</html>
