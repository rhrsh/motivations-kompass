<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Motivations-Kompass</title>
  <meta name="description" content="Wöchentlicher Check: Wie gut sind meine Motivatoren erfüllt?">
  <meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app">

  <!-- Bildschirm 1: ein Motivator pro Schritt -->
  <section class="screen" id="step">
    <div class="top">
      <button class="pill" id="backBtn" type="button">← Zurück</button>
      <span class="saved" id="saveState" aria-live="polite"></span>
      <span class="eyebrow" id="stepCount">1 / 7</span>
    </div>
    <div class="progress" id="progress" aria-label="Motivatoren"></div>
    <div class="q" id="qBox">
      <h2 id="qName"></h2>
      <p id="qText"></p>
    </div>
    <div class="spacer"></div>
    <div class="scale" id="scale" role="radiogroup" aria-label="Wie erfüllt?"></div>
    <textarea id="comment" rows="2" enterkeyhint="next" placeholder="Warum? (optional)"></textarea>
  </section>

  <!-- Bildschirm 2: Zusammenfassung -->
  <section class="screen" id="summary" hidden>
    <span class="eyebrow" id="sumWeek">KW</span>
    <h1>Dein Kompass diese Woche</h1>
    <div class="card score"><span>Im Schnitt</span><b id="avg">–</b></div>
    <div class="card"><div class="items" id="items"></div></div>
    <p class="note">Zum Ändern einen Motivator antippen.</p>
    <button class="btn ghost" id="editBtn" type="button">Nochmal durchgehen</button>
    <button class="link" id="exportBtn" type="button">Daten sichern (Datei)</button>
    <p class="note" id="savedNote"></p>
    <p class="note" id="version"></p>
  </section>

</div>
</body>
</html>
